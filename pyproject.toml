[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelmed"
version = "0.1.0"
description = "Local de-identification of Mexican clinical tables and notes (proof of concept, synthetic data only)"
license = {text = "MIT"}
authors = [{name = "Roberto Sanchez Valenzuela"}]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "scikit-learn>=1.4", "joblib>=1.3", "numpy"]

[project.optional-dependencies]
ner = ["spacy>=3.7"]
excel = ["openpyxl"]
dev = ["pytest>=8"]

[project.scripts]
sentinelmed = "sentinelmed.cli:main"

[tool.setuptools]
packages = ["sentinelmed"]

[tool.setuptools.package-data]
sentinelmed = ["data/*.txt"]
